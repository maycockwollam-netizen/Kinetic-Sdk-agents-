[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-agent-sdk"
version = "0.1.0"
description = "A modular agent SDK for the KINETIC coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KINETIC" }]
dependencies = []

[project.optional-dependencies]
llm = ["litellm>=1.50"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
target-version = "py310"
# Deliberately narrow: pyflakes (F), syntax-level pycodestyle (E9) and import
# sorting (I). Broader style rules are a future decision, not silently imposed.
lint.select = ["F", "E9", "I"]

[tool.setuptools.packages.find]
include = ["kinetic_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
